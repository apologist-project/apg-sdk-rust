[package]
name = "apologist"
version = "1.0.2"
edition = "2021"
authors = ["Apologist"]
description = "Official Rust SDK for the Apologist Agent API"
license = "MIT"
repository = "https://github.com/apologist-project/apg-sdk-rust"
documentation = "https://docs.apologist.ai"
homepage = "https://docs.apologist.ai"
readme = "README.md"
keywords = ["apologist", "api", "sdk"]
categories = ["api-bindings"]

[lib]
doctest = false

[dependencies]
bytes = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "gzip"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"

